stages:
  - build

build-image:
  stage: build
  image: docker:24-cli

  tags:
    - docker


  script:

    - docker version
    - echo "REG_USER=[$REG_USER]"
    - echo "REG_PASS=[$REG_PASS]"
    - echo "$REG_PASS" | docker login 192.168.96.116:5000 --username "$REG_USER" --password-stdin
    - docker build -t 192.168.96.116:5000/app/testimage:v0.2.1 .
    # - docker tag test-image 192.168.96.116:5000/app/testimage:0.0.1
    - docker push 192.168.96.116:5000/app/testimage:v0.2.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "zomzom11-main-patch-59481"'