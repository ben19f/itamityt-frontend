stages:
  - build
  - update

build-image:
  stage: build
  image: docker:24-cli

  tags:
    - docker


  script:

    - IMAGE=192.168.96.116:5000/app/frontend
    - docker version
    - echo "REG_USER=[$REG_USER]"
    - echo "REG_PASS=[$REG_PASS]"
    - echo "$REG_PASS" | docker login 192.168.96.116:5000 --username "$REG_USER" --password-stdin
    - docker build -t $IMAGE:$CI_COMMIT_TAG .
    - docker tag $IMAGE:$CI_COMMIT_TAG $IMAGE:latest
    - docker push $IMAGE:$CI_COMMIT_TAG
    - docker push $IMAGE:latest
  rules:
    - if: '$CI_COMMIT_TAG'

update-infra:

  stage: update
  image: alpine:latest
  tags:
    - docker

  script:
    - apk add git sed
    - git clone https://gitlab.com/itamityt/itamityt-infra.git
    - cd itamityt-infra
    - git switch forhelm
    - sed -i "s|frontend:.*|frontend:$CI_COMMIT_TAG|g" values-dev.yaml
    - git config user.email "ci@bot.com"
    - git config user.name "ci-bot"
    - git commit -am "update frontend image to $CI_COMMIT_TAG"
    - git push
  rules:

    - if: '$CI_COMMIT_TAG'