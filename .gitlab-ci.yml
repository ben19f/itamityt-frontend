stages:
  - build

build-image:
  stage: build
  image: docker:24-cli

  tags:
    - docker


  script:


    - docker version
    - echo "REG_USER=[$REG_USER]"
    - echo "REG_PASS=[$REG_PASS]"
    - echo "$REG_PASS" | docker login 192.168.96.116:5000 --username "$REG_USER" --password-stdin
    - docker build -t 192.168.96.116:5000/app/frontend:$CI_COMMIT_TAG .
    - docker tag 192.168.96.116:5000/app/frontend:$CI_COMMIT_TAG 192.168.96.116:5000/app/frontend:latest
    - docker push 192.168.96.116:5000/app/frontend:$CI_COMMIT_TAG
    - docker push 192.168.96.116:5000/app/frontend:latest
  rules:
    - if: '$CI_COMMIT_TAG'